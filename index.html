<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<title>Map ratings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <h1>Rate a map</h1>
  </div>
  <div class="account">
    <button id="filesBtn" type="button">Files</button>
    <span id="who">Checking sign-in…</span>
    <button id="authBtn" type="button" hidden></button>
  </div>
</header>

<section class="controls" aria-label="Filters">
  <input id="search" type="search" placeholder="Search maps" aria-label="Search maps">
  <div id="cats" class="cats" role="group" aria-label="Category"></div>
  <select id="sort" aria-label="Sort">
    <option value="name">Sort by name</option>
    <option value="top">Highest rated</option>
    <option value="votes">Most votes</option>
    <option value="unrated">Not rated by me</option>
  </select>
</section>

<p id="status" class="status" role="status"></p>
<main id="grid" class="grid"></main>

<dialog id="filesDialog" aria-labelledby="filesTitle">
  <div class="dlg-head">
    <h2 id="filesTitle">Shared files</h2>
    <button id="filesClose" type="button" aria-label="Close">✕</button>
  </div>
  <p class="sub">Upload and download .js files. Name a file after a map (like labs.js) to make it that map’s download.</p>
  <div id="upload" class="upload" hidden>
    <input id="file" type="file" accept=".js,text/javascript" aria-label="Choose a .js file">
    <input id="desc" type="text" maxlength="300" placeholder="Short description (optional)" aria-label="Description">
    <button id="uploadBtn" type="button" class="primary">Upload</button>
  </div>
  <p id="uploadHint" class="status">Sign in with Google to upload.</p>
  <input id="fileSearch" type="search" placeholder="Search files" aria-label="Search files">
  <p id="fileStatus" class="status" role="status"></p>
  <div id="fileList" class="file-list"></div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
